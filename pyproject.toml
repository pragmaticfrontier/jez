[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jez"
version = "1.0.0"
description = "Jez: decision models that answer Jev's HTTP API field for field. No text generation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.10",
  "transformers>=5.3",
  "accelerate>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "numpy>=1.26",
  "zstandard>=0.22",
  "huggingface_hub>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "typesafe-sdk[zstd]>=0.7.5"]
train = ["peft>=0.13", "pyarrow>=15", "flash-linear-attention>=0.5"]
cloud = ["modal>=1.0"]
mlx = ["mlx>=0.30", "mlx-lm>=0.30"]

[project.scripts]
sysone-serve = "sysone.server:main"
jez-serve = "jez.server:main"

[tool.setuptools.packages.find]
include = ["sysone*", "jez*", "eval*", "train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
